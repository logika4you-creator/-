<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Site</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h2>Game World</h2>

        <nav>
            <ul class="menu-list">
                <li><a href="#hero">Головна</a></li>
                <li><a href="#characters">Персонажі</a></li>
                <li><a href="#about">Про гру</a></li>
            </ul>
        </nav>

    </header>

    <!-- HERO -->

    <section class="hero" id="hero">

        <div class="hero-text">

            <h1>Ласкаво просимо!</h1>

            <p>
                Досліджуй світ, знайомся з персонажами
                та відкривай нові пригоди.
            </p>

            <a href="#" class="play-btn">Грати</a>

        </div>

        <!-- головне фото -->
        <img src="tomas.jpg" alt="Hero image">

    </section>

    <!-- CHARACTERS -->

    <section id="characters">

        <h2>Персонажі</h2>

        <div class="cards">

            <div class="card">

                <img src="nyut.jpg" alt="Nyut">

                <h3>Nyut</h3>

            </div>

            <div class="card">

                <img src="galli.jpg" alt="Galli">

                <h3>Galli</h3>

            </div>

            <div class="card">

                <img src="mincho.jpg" alt="Mincho">

                <h3>Mincho</h3>

            </div>

        </div>

    </section>

    <!-- ABOUT -->

    <section id="about">

        <h2>Про гру</h2>

        <ul id="players">
            <li>Пригоди</li>
            <li>Бої</li>
            <li>Дослідження світу</li>
        </ul>

    </section>

    <!-- FOOTER -->

    <footer id="maps">

        <h2>Дякую за перегляд</h2>

        <p>
            Створено як навчальний проєкт 2026
        </p>

    </footer>

</body>

</html>
